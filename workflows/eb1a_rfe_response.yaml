schema_version: 0.2-draft
task_type: eb1a_rfe_response
status: active_draft

purpose: >
  Strategy-driven EB-1A RFE response workflow. Stage 1 converts the human
  strategy and full RFE into a durable manifest. This workflow then drafts the
  exact ordered units declared by that manifest and injects the matching RFE,
  initial-filing, and new-evidence context into every prompt.

instruction_sources:
  universal:
    - instructions/universal/writing_rules.md
    - instructions/universal/evidence_rules.md
    - instructions/universal/citation_rules.md
    - instructions/universal/quality_control.md
  visa_or_rfe_specific:
    - templates/RFE/EB1/EB1A_RFE_response_unified_LLM_template.yaml
  task_type:
    - instructions/task_types/eb1a_rfe_response/task_rules.md
  case_specific: user_case_instructions.md

manual_provider:
  mode: prompt_file_then_manual_import
  prompt_dir: generated_prompts
  output_dir: llm_outputs
  validated_dir: validated_outputs
  required_output_schema: schemas/llm_section_output.schema.json

steps:
  - step_id: rfe_dynamic_section
    execution: llm_manual_repeatable
    repeat_unit: one_strategy_manifest_unit
    rfe_strategy_units: true
    title: Strategy-controlled RFE response section
    objective: >
      Draft exactly one section or criterion episode declared by the accepted
      RFE strategy manifest. Follow its strategy and respond only to its mapped
      RFE issues. Use its criterion-specific initial filing text and mapped
      original/translation evidence folders.
    section_instructions: instructions/task_types/eb1a_rfe_response/sections/rfe_issue_response.md
    destination_pattern: draft_sections/rfe/sections/{episode_id}.md

notes:
  - case_strategy/strategy_manifest.json is the single source of truth for drafting units and order.
  - user_case_instructions.md remains a higher-priority manual override for an individual drafting prompt.
